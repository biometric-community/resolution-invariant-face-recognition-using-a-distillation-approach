paper:
  slug: resolution-invariant-face-recognition-using-a-distillation-approach
  title: "Resolution-Invariant Face Recognition Using a Distillation Approach"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: 1024
model:
  image_size: 112
  embed_dim: 512
  pretrained_backbone: true
  lr_scales: [1.0, 0.5, 0.25]
train:
  protocol: smoke
  seed: 42
  num_workers: 2
  batch_size: 32
  teacher_epochs: 1
  student_epochs: 1
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  kl_temp: 4.0
  kl_weight: 1.0
  ce_weight: 1.0
eval:
  batch_size: 64
  max_lfw_pairs: 200
  eval_scales: [1.0, 0.5, 0.25]
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures/smoke
device: cuda
